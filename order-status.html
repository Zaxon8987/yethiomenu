<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Status â€” YeEthioMenu</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .tracking-container { max-width: 500px; margin: 40px auto; text-align: center; }
    .tracking-container input { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; }
    .tracking-container input:focus { border-color: var(--green); }
    .status-steps { display: flex; justify-content: space-between; margin: 40px 0; position: relative; }
    .status-steps::before { content: ''; position: absolute; top: 20px; left: 10%; right: 10%; height: 4px; background: #e0e0e0; z-index: 0; }
    .step { display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; flex: 1; }
    .step .circle { width: 40px; height: 40px; border-radius: 50%; background: #e0e0e0; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; margin-bottom: 8px; transition: 0.3s; }
    .step.active .circle { background: var(--green); color: white; }
    .step.completed .circle { background: var(--green); color: white; }
    .step .label { font-size: 0.8rem; color: var(--gray); }
    .step.active .label, .step.completed .label { color: var(--dark); font-weight: 600; }
    .order-detail { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); margin-top: 20px; text-align: left; }
    .order-detail .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
    .order-detail .row:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <a href="/" class="logo">Ye<span>Ethio</span>Menu</a>
      <a href="/" class="btn btn-outline btn-sm">â† Back</a>
    </div>
  </header>

  <main class="container">
    <div class="tracking-container">
      <h2>ðŸ” Track Your Order</h2>
      <p style="color:gray;margin:12px 0">Enter your order ID or phone number</p>
      <input type="text" id="trackInput" placeholder="Order ID or phone number">
      <button class="btn btn-primary" onclick="trackOrder()" style="width:100%">Track Order</button>
      <div id="trackResult" style="margin-top:20px"></div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
  <script>
    let supabase;

    function init() {
      if (!SUPABASE_URL || SUPABASE_URL === 'YOUR_SUPABASE_URL') return;
      supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const params = new URLSearchParams(window.location.search);
      if (params.get('id')) {
        document.getElementById('trackInput').value = params.get('id');
        trackOrder();
      }
    }

    async function trackOrder() {
      const val = document.getElementById('trackInput').value.trim();
      const result = document.getElementById('trackResult');
      if (!val) { result.innerHTML = '<div class="error-msg">Please enter an order ID or phone number.</div>'; return; }

      let query = supabase.from('orders').select('*, restaurants(name, phone)');
      const id = parseInt(val);
      if (!isNaN(id)) {
        query = query.eq('id', id);
      } else {
        query = query.eq('customer_phone', val);
      }

      const { data, error } = await query.limit(1);
      if (error || !data || !data.length) {
        result.innerHTML = '<div class="error-msg">Order not found. Check your order ID or phone number.</div>';
        return;
      }

      const o = data[0];
      const items = typeof o.items === 'string' ? JSON.parse(o.items) : (o.items || []);
      const total = items.reduce((s, i) => s + (i.price * i.qty), 0);
      const itemsStr = items.map(i => `${i.name} x${i.qty} = ${i.price * i.qty} ETB`).join('<br>');

      const statusOrder = ['new', 'confirmed', 'completed', 'cancelled'];
      const currentIdx = statusOrder.indexOf(o.status);
      const steps = [
        { label: 'Order Placed', emoji: 'ðŸ“', key: 'new' },
        { label: 'Confirmed', emoji: 'âœ…', key: 'confirmed' },
        { label: 'Completed', emoji: 'âœ”ï¸', key: 'completed' },
      ];

      result.innerHTML = `
        <div class="order-detail">
          <h3 style="margin-bottom:12px">ðŸª ${o.restaurants?.name || 'Restaurant'}</h3>
          <div class="status-steps">
            ${steps.map((s, i) => `
              <div class="step ${i <= currentIdx && o.status !== 'cancelled' ? (i < currentIdx ? 'completed' : 'active') : ''}">
                <div class="circle">${s.emoji}</div>
                <div class="label">${s.label}</div>
              </div>
            `).join('')}
          </div>
          ${o.status === 'cancelled' ? '<div style="color:var(--red);font-weight:700;font-size:1.2rem;margin:12px 0">âŒ Order Cancelled</div>' : ''}
          <div class="row"><span>Order ID</span><span>#${o.id}</span></div>
          <div class="row"><span>Items</span><span>${itemsStr}</span></div>
          <div class="row"><span>Total</span><span style="font-weight:700;color:var(--green)">${formatMoney(total)}</span></div>
          <div class="row"><span>Status</span><span>${o.status}</span></div>
          <div class="row"><span>Date</span><span>${new Date(o.created_at).toLocaleDateString()}</span></div>
          ${o.restaurants?.phone ? `<div class="row"><span>Restaurant Phone</span><span>ðŸ“ž ${o.restaurants.phone}</span></div>` : ''}
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
